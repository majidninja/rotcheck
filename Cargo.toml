[package]
name = "rotcheck"
version = "1.2.0"
edition = "2024"
description = "Detect missing, changed and silently corrupted files with plain sha256sum-compatible manifests"
license = "MIT"

[dependencies]

# Smaller, faster release binary (`cargo build --release`, `cargo install`).
[profile.release]
lto = true
codegen-units = 1
strip = true
